[project]
name = "optics-copilot"
version = "0.1.0"
description = "Content pipeline and RAG chatbot for an optics distributor"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.1",
    "selectolax>=1.0.2",
    "pypdf>=7.0.1",
    "apscheduler>=3.11.3",
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "aiogram==3.22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
