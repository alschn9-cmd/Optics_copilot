services:
  pipeline:
    build: .
    command: ["python", "-m", "pipeline", "schedule"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      CHROMA_PERSIST_DIR: /data/chroma
      PIPELINE_LOG_PATH: /data/pipeline.log
    volumes:
      - app-data:/data
    restart: unless-stopped

  bot-api:
    build: .
    command: ["uvicorn", "bot.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      CHROMA_PERSIST_DIR: /data/chroma
      PIPELINE_LOG_PATH: /data/pipeline.log
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  telegram-bot:
    build: .
    command: ["python", "-m", "bot.telegram"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      CHROMA_PERSIST_DIR: /data/chroma
      PIPELINE_LOG_PATH: /data/pipeline.log
    volumes:
      - app-data:/data
    restart: unless-stopped

  admin:
    build: .
    command:
      [
        "streamlit",
        "run",
        "admin/main.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--server.headless",
        "true",
        "--server.fileWatcherType",
        "none",
      ]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      CHROMA_PERSIST_DIR: /data/chroma
      PIPELINE_LOG_PATH: /data/pipeline.log
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
